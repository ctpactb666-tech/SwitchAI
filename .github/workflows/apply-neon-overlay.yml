name: Apply Neon Overlay

on:
  push:
    branches: ["feature/wake-word"]
    paths:
      - ".github/workflows/apply-neon-overlay.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wake-word
          fetch-depth: 0

      - name: Apply overlay implementation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/java/com/wstxda/switchai/overlay
          cat > app/src/main/java/com/wstxda/switchai/overlay/NeonOverlayService.kt <<'EOF'
          package com.wstxda.switchai.overlay

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import com.wstxda.switchai.R
          import com.wstxda.switchai.activity.MainActivity
          import kotlin.math.abs

          class NeonOverlayService : Service() {
              private lateinit var windowManager: WindowManager
              private var overlay: View? = null

              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startForeground(NOTIFICATION_ID, buildNotification())
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }
                  showOverlay()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  if (overlay == null) showOverlay()
                  return START_STICKY
              }

              override fun onDestroy() {
                  overlay?.let { runCatching { windowManager.removeView(it) } }
                  overlay = null
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun showOverlay() {
                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(13), dp(7), dp(7), dp(7))
                      setBackgroundResource(R.drawable.bg_neon_card_glow)
                      elevation = dp(10).toFloat()
                  }

                  val label = TextView(this).apply {
                      text = getString(R.string.neon_overlay_ready)
                      setTextColor(ContextCompat.getColor(this@NeonOverlayService, R.color.neon_text_primary))
                      textSize = 12f
                      maxLines = 1
                      setPadding(0, 0, dp(10), 0)
                  }

                  val mic = ImageView(this).apply {
                      setImageResource(R.drawable.ic_mic)
                      setColorFilter(ContextCompat.getColor(this@NeonOverlayService, android.R.color.white))
                      setBackgroundResource(R.drawable.bg_neon_round_button)
                      setPadding(dp(13), dp(13), dp(13), dp(13))
                      contentDescription = getString(R.string.neon_overlay_open)
                      layoutParams = LinearLayout.LayoutParams(dp(48), dp(48))
                      setOnClickListener { openSwitchAi() }
                  }

                  root.addView(label, LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f))
                  root.addView(mic)

                  val params = WindowManager.LayoutParams(
                      dp(190),
                      dp(62),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT,
                  ).apply {
                      gravity = Gravity.TOP or Gravity.END
                      x = dp(12)
                      y = dp(120)
                  }

                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  root.setOnTouchListener { _, event ->
                      when (event.actionMasked) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = event.rawX
                              touchY = event.rawY
                              moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (touchX - event.rawX).toInt()
                              val dy = (event.rawY - touchY).toInt()
                              if (abs(dx) > dp(3) || abs(dy) > dp(3)) moved = true
                              params.x = (startX + dx).coerceAtLeast(0)
                              params.y = (startY + dy).coerceAtLeast(0)
                              runCatching { windowManager.updateViewLayout(root, params) }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) openSwitchAi()
                              true
                          }
                          else -> false
                      }
                  }

                  windowManager.addView(root, params)
                  overlay = root
              }

              private fun openSwitchAi() {
                  startActivity(
                      Intent(this, MainActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_SINGLE_TOP)
                      }
                  )
              }

              private fun buildNotification() = NotificationCompat.Builder(this, CHANNEL_ID)
                  .setSmallIcon(R.drawable.ic_mic)
                  .setContentTitle(getString(R.string.app_name))
                  .setContentText(getString(R.string.neon_overlay_notification))
                  .setOngoing(true)
                  .setCategory(NotificationCompat.CATEGORY_SERVICE)
                  .setContentIntent(
                      PendingIntent.getActivity(
                          this,
                          0,
                          Intent(this, MainActivity::class.java),
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE,
                      )
                  )
                  .build()

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              getString(R.string.neon_overlay_channel),
                              NotificationManager.IMPORTANCE_LOW,
                          )
                      )
                  }
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              companion object {
                  private const val CHANNEL_ID = "switchai_overlay"
                  private const val NOTIFICATION_ID = 8422

                  fun start(context: Context) {
                      if (Settings.canDrawOverlays(context)) {
                          ContextCompat.startForegroundService(context, Intent(context, NeonOverlayService::class.java))
                      }
                  }

                  fun stop(context: Context) {
                      context.stopService(Intent(context, NeonOverlayService::class.java))
                  }
              }
          }
          EOF

          python - <<'PY'
          from pathlib import Path

          manifest = Path('app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'android.permission.SYSTEM_ALERT_WINDOW' not in s:
              s = s.replace(
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />'
              )
          if '.overlay.NeonOverlayService' not in s:
              marker = '''        <service\n            android:name=".wakeword.WakeWordService"\n            android:exported="false"\n            android:foregroundServiceType="microphone" />'''
              addition = marker + '''\n\n        <!--persistent neon overlay-->\n        <service\n            android:name=".overlay.NeonOverlayService"\n            android:exported="false"\n            android:foregroundServiceType="specialUse">\n            <property\n                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n                android:value="Persistent AI assistant overlay controls" />\n        </service>'''
              s = s.replace(marker, addition)
          manifest.write_text(s)

          settings = Path('app/src/main/java/com/wstxda/switchai/wakeword/WakeWordSettings.kt')
          s = settings.read_text()
          if 'KEY_OVERLAY' not in s:
              s = s.replace(
                  'const val KEY_OWNER_ONLY = "owner_voice_only"',
                  'const val KEY_OWNER_ONLY = "owner_voice_only"\n    const val KEY_OVERLAY = "wake_neon_overlay"'
              )
          settings.write_text(s)

          layout = Path('app/src/main/res/layout/fragment_voice_activation.xml')
          s = layout.read_text()
          if 'rowOverlay' not in s:
              marker = '''                <include\n                    android:id="@+id/rowSound"\n                    layout="@layout/item_neon_switch_row" />'''
              addition = '''                <include\n                    android:id="@+id/rowOverlay"\n                    layout="@layout/item_neon_switch_row" />\n\n''' + marker
              s = s.replace(marker, addition)
          layout.write_text(s)

          strings = Path('app/src/main/res/values/strings_neon_ui.xml')
          s = strings.read_text()
          if 'neon_overlay_enable' not in s:
              block = '''    <string name="neon_overlay_enable">Плавающий мини-виджет</string>\n    <string name="neon_overlay_permission">Разрешите SwitchAI показывать мини-виджет поверх других приложений</string>\n    <string name="neon_overlay_ready">SwitchAI • готов</string>\n    <string name="neon_overlay_open">Открыть SwitchAI</string>\n    <string name="neon_overlay_channel">Мини-виджет SwitchAI</string>\n    <string name="neon_overlay_notification">Неоновый мини-виджет активен</string>\n'''
              s = s.replace('    <string name="neon_unavailable_message">', block + '    <string name="neon_unavailable_message">')
          strings.write_text(s)
          PY

          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/wstxda/switchai/fragment/VoiceActivationFragment.kt')
          s = p.read_text()
          if 'NeonOverlayService' not in s:
              s = s.replace('import android.os.Bundle', 'import android.os.Bundle\nimport android.content.Intent\nimport android.net.Uri\nimport android.provider.Settings')
              s = s.replace('import com.wstxda.switchai.R', 'import com.wstxda.switchai.R\nimport com.wstxda.switchai.overlay.NeonOverlayService')
              s = s.replace(
                  '    private lateinit var activationSwitch: MaterialSwitch',
                  '''    private lateinit var activationSwitch: MaterialSwitch\n    private lateinit var overlaySwitch: MaterialSwitch\n    private var pendingOverlayEnable = false'''
              )
              anchor = '''    private val permissionLauncher = registerForActivityResult(\n        ActivityResultContracts.RequestMultiplePermissions()\n    ) {\n        if (WakeWordSettings.hasMicPermission(requireContext())) {\n            setActivation(true)\n        } else {\n            setSwitchSilently(false)\n            Toast.makeText(requireContext(), R.string.neon_mic_permission_needed, Toast.LENGTH_LONG).show()\n        }\n    }'''
              addition = anchor + '''\n\n    private val overlayPermissionLauncher = registerForActivityResult(\n        ActivityResultContracts.StartActivityForResult()\n    ) {\n        val allowed = Settings.canDrawOverlays(requireContext())\n        setOverlaySwitchSilently(allowed && pendingOverlayEnable)\n        WakeWordSettings.putBoolean(requireContext(), WakeWordSettings.KEY_OVERLAY, allowed && pendingOverlayEnable)\n        if (allowed && pendingOverlayEnable) {\n            NeonOverlayService.start(requireContext())\n        } else if (pendingOverlayEnable) {\n            Toast.makeText(requireContext(), R.string.neon_overlay_permission, Toast.LENGTH_LONG).show()\n        }\n        pendingOverlayEnable = false\n    }'''
              s = s.replace(anchor, addition)
              bind_anchor = '''        bindPref(view, R.id.rowBluetooth, R.drawable.ic_headset, R.string.neon_bluetooth, WakeWordSettings.KEY_BLUETOOTH)'''
              bind_add = bind_anchor + '''\n        overlaySwitch = NeonViews.bindSwitchRow(\n            view.findViewById(R.id.rowOverlay),\n            R.drawable.ic_assistant,\n            getString(R.string.neon_overlay_enable),\n            WakeWordSettings.getBoolean(context, WakeWordSettings.KEY_OVERLAY, false) && Settings.canDrawOverlays(context),\n        ) { onOverlayChanged(it) }\n        if (overlaySwitch.isChecked) NeonOverlayService.start(context)'''
              s = s.replace(bind_anchor, bind_add)
              helper_anchor = '''    private fun onActivationChanged(checked: Boolean) {'''
              helper = '''    private fun onOverlayChanged(enabled: Boolean) {\n        val context = requireContext()\n        if (!enabled) {\n            pendingOverlayEnable = false\n            WakeWordSettings.putBoolean(context, WakeWordSettings.KEY_OVERLAY, false)\n            NeonOverlayService.stop(context)\n            return\n        }\n        if (Settings.canDrawOverlays(context)) {\n            WakeWordSettings.putBoolean(context, WakeWordSettings.KEY_OVERLAY, true)\n            NeonOverlayService.start(context)\n            return\n        }\n        pendingOverlayEnable = true\n        setOverlaySwitchSilently(false)\n        overlayPermissionLauncher.launch(\n            Intent(\n                Settings.ACTION_MANAGE_OVERLAY_PERMISSION,\n                Uri.parse("package:${context.packageName}"),\n            )\n        )\n    }\n\n    private fun setOverlaySwitchSilently(checked: Boolean) {\n        overlaySwitch.setOnCheckedChangeListener(null)\n        overlaySwitch.isChecked = checked\n        overlaySwitch.setOnCheckedChangeListener { _, enabled -> onOverlayChanged(enabled) }\n    }\n\n''' + helper_anchor
              s = s.replace(helper_anchor, helper)
          p.write_text(s)
          PY

          rm -f .github/workflows/apply-neon-overlay.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add persistent neon overlay widget"
          git push origin HEAD:feature/wake-word
