name: Apply Neon UI Patch

on:
  push:
    branches: ["feature/wake-word"]
    paths:
      - ".neon_patch/READY"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger neon UI import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/wake-word
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .neon_patch/part{00..13} > /tmp/neon_delta.b64
          base64 --decode /tmp/neon_delta.b64 > /tmp/neon_delta.zip
          echo "3749d631c1dddc03bc63365bb6e53338855bb25f5f563bd8e2ba0ded3fe393ea  /tmp/neon_delta.zip" | sha256sum --check
          unzip -t /tmp/neon_delta.zip

      - name: Apply Claude neon UI archive
        shell: bash
        run: |
          rm -rf /tmp/neon_delta
          mkdir -p /tmp/neon_delta
          unzip -q /tmp/neon_delta.zip -d /tmp/neon_delta
          rsync -a --exclude='.neon_deleted.json' /tmp/neon_delta/ ./
          python3 - <<'PY'
          import json
          from pathlib import Path
          manifest = Path("/tmp/neon_delta/.neon_deleted.json")
          for rel in json.loads(manifest.read_text(encoding="utf-8")):
              target = Path(rel)
              if target.is_file() or target.is_symlink():
                  target.unlink()
          PY
          rm -rf .neon_patch
          rm -f .github/workflows/apply-neon-patch.yml

      - name: Commit imported UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Claude neon UI"
          git push origin HEAD:feature/wake-word
