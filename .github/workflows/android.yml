name: Android CI
# CI trigger for wake-word branch
# second CI trigger

on:
  workflow_dispatch:
  push:
    branches: ["main", "feature/wake-word"]
  pull_request:
    branches: ["main"]

jobs:
  build_debug_apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Set Up JDK 22
        uses: actions/setup-java@v6
        with:
          java-version: '22'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download sherpa-onnx Android runtime
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 5 --retry-all-errors \
            --output app/libs/sherpa-onnx-1.13.8.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum --check

      - name: Download speaker recognition model
        run: |
          mkdir -p app/src/main/assets/models
          curl --fail --location --retry 5 --retry-all-errors \
            --output app/src/main/assets/models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          test -s app/src/main/assets/models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx

      - name: Run Code Linting
        run: ./gradlew lint

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug

      - name: Upload Lint & Test Reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/lint-results*.html
            app/build/reports/tests/
          retention-days: 7

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
          retention-days: 14